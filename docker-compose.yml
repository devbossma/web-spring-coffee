services:
  db:
    image: mysql:8.4
    container_name: web-spring-coffee-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: coffeeshop
      MYSQL_ROOT_PASSWORD: coffee123
    ports:
      - "3306:3306"
    volumes:
      - web-spring-coffee-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pcoffee123"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  web-spring-coffee-db-data:
