<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Coffee Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="page">
    <h1>&#9749; The Corner Coffee Shop</h1>
    <p class="tagline">Pick your coffee and any extras, we'll have it ready in a minute.</p>

    <form th:action="@{/order}" method="post">
        <div class="menu-grid">
            <label class="coffee-card" th:each="coffee : ${coffees}" th:attr="data-type=${coffee.name}">
                <svg class="cup" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                    <path d="M14 22h36l-3 26a8 8 0 0 1-8 7H25a8 8 0 0 1-8-7l-3-26z" fill="#fff" style="stroke:var(--coffee-dark);stroke-width:2"/>
                    <rect class="cup-liquid" x="18" y="26" width="28" height="10" rx="2"/>
                    <path d="M50 26c6 0 10 4 10 9s-4 9-10 9" fill="none" style="stroke:var(--coffee-dark);stroke-width:2"/>
                    <path d="M20 16c1-3 4-3 5 0M30 16c1-3 4-3 5 0M40 16c1-3 4-3 5 0" style="stroke:var(--coffee-mid);stroke-width:2" fill="none" stroke-linecap="round"/>
                </svg>
                <h3 th:text="${coffee.name}">Espresso</h3>
                <p class="price" th:text="'$' + ${coffee.basePrice}">$2.50</p>
                <input type="radio" name="coffeeType" th:value="${coffee.type}" required>
            </label>
        </div>

        <div class="extras-list">
            <label th:each="extra : ${extras}">
                <input type="checkbox" name="extras" th:value="${extra}">
                <span th:text="${extra.displayName}">Milk</span>
            </label>
        </div>

        <div style="text-align:center;">
            <button type="submit" class="btn">Place order</button>
        </div>
    </form>

    <div class="nav-links">
        <a th:href="@{/orders}">View my orders</a>
        <a th:href="@{/barista/login}">Barista login</a>
    </div>
</div>
</body>
</html>
